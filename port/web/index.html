<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MKDD Web Port</title>
<style>
  :root { --bg: #111214; --panel: #1b1d21; --ink: #e6e6e6; --muted: #9aa0a6; --accent: #e8443a; --line: #2c2f35; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.4 system-ui, sans-serif; }
  main { max-width: 980px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 18px; margin: 0 0 12px; font-weight: 600; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
  button, label.btn { background: var(--accent); color: #fff; border: 0; border-radius: 6px; padding: 8px 14px;
    font: inherit; cursor: pointer; }
  button[disabled] { opacity: .5; cursor: default; }
  label.btn input { display: none; }
  .muted { color: var(--muted); }
  #screen { width: 100%; aspect-ratio: 640 / 480; background: #000; display: block; border-radius: 6px; }
  #log { margin-top: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 8px;
    height: 220px; overflow: auto; font: 12px/1.35 ui-monospace, monospace; white-space: pre-wrap; }
</style>
</head>
<body>
<main>
  <h1>Mario Kart: Double Dash!! — WebAssembly port (decomp)</h1>
  <div class="bar">
    <label class="btn">Choose disc image (.iso / .gcm)<input id="pick" type="file" accept=".iso,.gcm"></label>
    <button id="start" disabled>Start</button>
    <button id="cardExport" title="Download the slot A memory card image">Export save</button>
    <label class="btn" title="Replace the slot A memory card with a card image (.raw)">Import save<input id="cardImport" type="file" accept=".raw,.bin"></label>
    <span id="status" class="muted">Your own disc image is read locally; nothing is uploaded.</span>
  </div>
  <canvas id="screen" width="640" height="480"></canvas>
  <p class="muted">Controls: arrows steer · X accelerate (A) · Z brake (B) · Q/W L/R (drift) · Space item (Z) ·
    C/V X/Y · Enter Start · I/J/K/L C-stick. Gamepads work too (standard mapping).</p>
  <div id="log"></div>
</main>
<script>
  const logEl = document.getElementById('log');
  const statusEl = document.getElementById('status');
  const startBtn = document.getElementById('start');
  const pick = document.getElementById('pick');
  const params = new URLSearchParams(location.search);
  let discFile = null;

  function log(text) {
    logEl.textContent += text + '\n';
    if (logEl.textContent.length > 200000) logEl.textContent = logEl.textContent.slice(-100000);
    logEl.scrollTop = logEl.scrollHeight;
  }

  // Remember the chosen disc image and the memory card between visits (browser-local IndexedDB).
  function idb() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open('mkdd-port', 2);
      req.onupgradeneeded = () => {
        const db = req.result;
        if (!db.objectStoreNames.contains('disc')) db.createObjectStore('disc');
        if (!db.objectStoreNames.contains('card')) db.createObjectStore('card');
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }
  async function saveDisc(file) {
    try { const db = await idb(); db.transaction('disc', 'readwrite').objectStore('disc').put(file, 'image'); } catch (e) {}
  }
  async function loadDisc() {
    try {
      const db = await idb();
      return await new Promise(r => { const q = db.transaction('disc').objectStore('disc').get('image'); q.onsuccess = () => r(q.result || null); q.onerror = () => r(null); });
    } catch (e) { return null; }
  }
  // Slot A memory card: a raw card image (see port/sdk/card.c), saved after each change.
  async function loadCard() {
    try {
      const db = await idb();
      return await new Promise(r => { const q = db.transaction('card').objectStore('card').get('slotA'); q.onsuccess = () => r(q.result || null); q.onerror = () => r(null); });
    } catch (e) { return null; }
  }
  async function storeCard(img) {
    try {
      const db = await idb();
      await new Promise((r, j) => { const t = db.transaction('card', 'readwrite'); t.objectStore('card').put(img, 'slotA'); t.oncomplete = r; t.onerror = () => j(t.error); });
    } catch (e) { log('memory card: could not save (' + e + ')'); }
  }
  let cardTimer = 0, cardPending = null;
  function cardSave(img) {
    cardPending = img;
    clearTimeout(cardTimer);
    cardTimer = setTimeout(() => { const i = cardPending; cardPending = null; storeCard(i); }, 300);
  }
  addEventListener('pagehide', () => { if (cardPending) { clearTimeout(cardTimer); storeCard(cardPending); cardPending = null; } });
  document.getElementById('cardExport').addEventListener('click', async () => {
    const img = (typeof Module !== 'undefined' && Module.cardImage) || await loadCard();
    if (!img) { log('memory card: nothing saved yet'); return; }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([img]));
    a.download = 'mkdd-slotA.raw';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  });
  document.getElementById('cardImport').addEventListener('change', async (ev) => {
    const f = ev.target.files[0];
    if (!f) return;
    const img = new Uint8Array(await f.arrayBuffer());
    if (![4, 8, 16, 32, 64, 128].some(m => img.length === m * 131072)) { log('memory card: not a card image (' + img.length + ' bytes)'); return; }
    await storeCard(img);
    log('memory card: imported ' + f.name + (Module.discFile ? ' (reload the page to use it)' : ''));
  });

  function setDisc(file) {
    discFile = file;
    startBtn.disabled = !file;
    statusEl.textContent = file ? `${file.name} (${(file.size / 1048576).toFixed(0)} MB)` : 'No disc image chosen.';
  }

  pick.addEventListener('change', () => { const f = pick.files[0]; if (f) { setDisc(f); saveDisc(f); } });
  loadDisc().then(f => { if (f && !discFile) setDisc(f); });

  // Environment switches for the port, from the URL: ?fast=1&threads=1
  // (GPU debugging: ?wgltrace=N logs frame N's batches, ?wgldebug=bits, see webgl_tev.cpp;
  //  ?dff=start:count records a Dolphin FIFO log of those frames and offers it for download)
  const env = {};
  if (params.has('fast')) env.MKDD_FAST_MOVIE = '1';
  if (params.has('threads')) env.MKDD_THREADS = '1';
  if (params.has('wgldebug')) env.MKDD_WGL_DEBUG = params.get('wgldebug');
  if (params.has('wgltrace')) env.MKDD_WGL_TRACE = params.get('wgltrace');
  if (params.has('dff')) { env.MKDD_DFF = '/mkdd.dff'; env.MKDD_DFF_FRAMES = params.get('dff'); }

  var Module = {
    canvas: document.getElementById('screen'),
    env,
    print: t => log(t),
    printErr: t => log(t),
    onRuntimeInitialized() { Module.portReady = true; if (discFile) startBtn.disabled = false; },
    onAbort: what => { log('ABORT: ' + what); statusEl.textContent = 'Stopped (see log).'; },
  };

  startBtn.addEventListener('click', async () => {
    if (!discFile) return;
    startBtn.disabled = true;
    pick.disabled = true;
    Module.discFile = discFile;
    // ?nocard=1: no memory card in slot A
    if (params.has('nocard')) Module.cardDisabled = true;
    else { Module.cardImage = await loadCard(); Module.cardSave = cardSave; }
    statusEl.textContent = 'Running ' + discFile.name;
    Module.callMain([]);
    if (env.MKDD_DFF) {
      const poll = setInterval(() => {
        let data;
        try { data = Module.FS.readFile(env.MKDD_DFF); } catch (e) { return; }
        clearInterval(poll);
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([data]));
        a.download = 'mkdd-' + env.MKDD_DFF_FRAMES.replace(':', '-') + '.dff';
        a.textContent = 'FIFO log ready: ' + a.download + ' (' + (data.length / 1048576).toFixed(1) + ' MB)';
        a.style.display = 'block';
        logEl.parentNode.insertBefore(a, logEl);
      }, 1000);
    }
  });
</script>
<script src="mkdd.js"></script>
<script src="input.js"></script>
<script src="audio.js"></script>
</body>
</html>
