<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>GPU backend test</title>
<style>
  body { margin: 0; background: #111214; color: #e6e6e6; font: 13px/1.4 ui-monospace, monospace; }
  #screen { display: block; width: 640px; height: 480px; background: #000; }
  #log { padding: 8px; white-space: pre-wrap; }
</style>
</head>
<body>
<canvas id="screen" width="640" height="480"></canvas>
<div id="log"></div>
<script>
  const logEl = document.getElementById('log');
  const log = t => { logEl.textContent += t + '\n'; };
  var Module = { canvas: document.getElementById('screen'), print: log, printErr: log,
    arguments: [new URLSearchParams(location.search).get('scene') || '1'] };
</script>
<script src="webgl_test.js"></script>
</body>
</html>
