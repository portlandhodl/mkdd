[package]
name = "mkdd-track-studio"
version = "0.1.0"
edition = "2024"
description = "Offline Rust/WASM/WebGL editor for Mario Kart Double Dash course assets"
license = "CC0-1.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
glam = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"

[dependencies.web-sys]
version = "0.3"
features = [
    "CanvasRenderingContext2d",
    "console",
    "CssStyleDeclaration",
    "Document",
    "Element",
    "Event",
    "HtmlCanvasElement",
    "HtmlElement",
    "Window",
    "WebGl2RenderingContext",
    "WebGlBuffer",
    "WebGlProgram",
    "WebGlShader",
    "WebGlTexture",
    "WebGlVertexArrayObject",
    "WebGlUniformLocation",
]

[dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
lto = true
opt-level = "s"

# The current Rust toolchain emits post-MVP instructions by default. Some
# distro wasm-opt builds reject those before applying their feature flags.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
